<style type=text/css>
body {
  font-family: "Roboto", sans-serif;
  font-optical-sizing: auto;
  font-weight: 400;
  font-style: normal;
  font-variation-settings:
    "wdth" 100;
  margin: 0;
}
h1 {
  display: inline-block;
  margin: 0;

  width: 100%;

  font-size: 60pt;
}
@media (max-width: 60em) {
  h1 {
    padding-top: 1em;
  }
}
a {
  color: #333;
}
#facts {
  max-width: 50em;
  display: flex;
  flex-direction: column;
  font-size: 17pt;
  margin: 1em;
  background: linear-gradient(#aaa, #aaa) no-repeat center/2px 100%;
  padding: 1em 0 1em 0;
}
#facts .one {
  display: flex;
  flex-direction: row;
  justify-content: center;
  margin: 0.3em;
}
#facts .one .left {
  width: 50%;
  text-align: right;
  padding-right: 1em;
}
#facts .one .right {
  width: 50%;
  text-align: left;
  padding-left: 1em;
}
#calendar {
 max-width: 100em;
 margin: 1em;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.4.0/ical.min.js"></script>
<script src='https://cdn.jsdelivr.net/npm/rrule@2.7.1/dist/es5/rrule.min.js'></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.18/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/rrule@6.1.18/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.18/locales/cs.global.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var calendarEl = document.getElementById("calendar");

  var calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: "list",
    duration: { days: 66 },
    locale: 'cs',
    selectable: true,
    headerToolbar: {
      left: "list,multiMonthYear",
      center: "title",
      right: "",
    },
    multiMonthMaxColumns: 1,
    events: {
      url: "https://api.hraseho.cz/svj.ics",
      format: "ics",
    },
    eventContent: (arg) => {
      if (arg.view.type.startsWith('list')) {
        var buf = arg.event.title
        if (arg.event.extendedProps.location) {
          buf += '<br />⚑ ' + arg.event.extendedProps.location + '</i>';
        }
        if (arg.event.extendedProps.description) {
          buf += '<br />' + arg.event.extendedProps.description;
        }
        return {html: buf};
      }
      return arg.event.title;
    },
  });

  calendar.render();
});
</script>
</head>

<h1>SVJ Hrašeho 918-922</h1>
<div id=facts>

  </div>

    <div class=right><a href=mailto:ajalamudis@tvoeurope.com>Alexis Jalamudis</a>, TVO Europe</div>
  </div>
  <div class=one>
    <div class=left>Výbor</div>
    <div class=right><a href=mailto:svj@hraseho.cz>svj@hraseho.cz</a></div>
  </div>
  <div class=one>
    <div class=left>IČO</div>
    <div class=right><a href=https://ares.gov.cz/ekonomicke-subjekty?ico=17284678>17284678</a></div>
  </div>
  <div class=one>
    <div class=left>Odebírejte kalendář</div>
    <div class=right><a href=https://calendar.google.com/calendar/r?cid=webcal://api.hraseho.cz/svj.ics>Google</a>, <a href=webcal://api.hraseho.cz/svj.ics>Apple</a></div>
  </div>

    <div class=right><a href=./finance-2025.html>2025</a></div>
  </div>
</div>
